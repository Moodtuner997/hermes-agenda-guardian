name: agenda-guardian
label: Agenda Guardian
kind: standalone
version: "0.2.0"
manifest_version: 2
author: Moodtuner997
homepage: https://github.com/Moodtuner997/hermes-agenda-guardian
description: >
  A day planner for people whose discipline cannot be the plan. You write your rules once (work hours,
  protected time, focus window, longest stretch, tasks per day), estimate each task, and report the real time
  when it is done: from the third finished task of a kind, the planner corrects your estimates by your own
  median error and says so. It places tasks in the free time around the meetings of any calendar source
  (Google Workspace skill, ICS file or URL, JSON file, or any command that prints event JSON), and every
  block states the rule it comes from. A full day says what does not fit. Deterministic, no model call,
  never writes to a calendar.
requires_hermes: ">=0.22.7"
provides_tools:
  - day_setup
  - day_add_task
  - day_plan
  - day_done
  - day_tasks
  - day_schedule
  - day_kind
  - day_habit
  - day_propose
  - day_confirm
  - day_undo
  - day_took
  - day_week
provides_hooks: []
