name: agenda-guardian
label: Agenda Guardian
kind: standalone
version: "0.5.4"
manifest_version: 2
author: Moodtuner997
homepage: https://github.com/Moodtuner997/hermes-agenda-guardian
description: >
  A day and week planner for people whose discipline cannot be the plan. You write your rules once and
  estimate each task; from the third finished task of a kind, the planner corrects your estimates by your own
  median error. It places tasks in the free time around the meetings of any calendar source (Google Workspace
  skill, ICS file or URL, JSON file, or any command that prints event JSON) and every block states its reason.
  Activities such as sport get a proposal that explains itself from eight weeks of your calendar history, and a
  whole week (sport, calls, a daily course) is placed in one request, each activity around the others, and you
  talk to it in plain words: no syntax to learn, a missing figure is assumed and said. History orders the days
  but never rules out a day your calendar leaves free. Reads your calendar by default. Writing to a
  Google calendar is off until you type /day write on; then it adds events marked as its own, only after you
  say yes, and removes only those; plans the agent composes go through the same road. A /day message that is not one of
  the few format-free commands is handed to the agent. Only you set the calendar source; when the agent's terminal,
  code or file tools take an obvious side road to it, the call goes to Hermes' own approval prompt. Deterministic,
  no model call.
requires_hermes: ">=0.22.7"
provides_tools:
  - day_setup
  - day_add_task
  - day_plan
  - day_done
  - day_tasks
  - day_schedule
  - day_kind
  - day_habit
  - day_propose
  - day_confirm
  - day_undo
  - day_took
  - day_week
  - day_week_plan
  - day_stage
provides_hooks:
  - pre_gateway_dispatch
  - pre_tool_call
